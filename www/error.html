<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .error-container {
            max-width: 600px;
            padding: 40px;
            text-align: center;

            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }

        p {
            margin: 0;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="error-container">
        <h1>Something went wrong</h1>

        <p>
            The server could not complete your request.
        </p>
    </div>

</body>
</html>
