server {
    host 127.0.0.1;
    listen 18080;
    root www;
    client_max_body_size 10;

    location / {
        methods POST;
    }
    location /inherit {
        methods POST;
    }
    location /strict {
        methods POST;
        client_max_body_size 4;
    }
    location /loose {
        methods POST;
        client_max_body_size 20;
    }
    location /strict/private {
        methods POST;
        client_max_body_size 2;
    }
}
