server {
    host 127.0.0.1;
    listen 8080;

    root www;
    client_max_body_size 20m;

    error_page 400 errors/400.html;
    error_page 403 errors/403.html;
    error_page 404 errors/404.html;
    error_page 405 errors/405.html;
    error_page 413 errors/413.html;
    error_page 500 errors/500.html;

    location / {
        methods GET;
        index index.html;
        autoindex off;
    }

    location /files {
        methods GET;
        root www/files;
        autoindex on;
    }

    location /upload {
        methods GET POST DELETE;
        root www/uploads;

        upload on;
        upload_store www/uploads;

        client_max_body_size 10m;
        autoindex off;
    }

    location /old {
        methods GET;
        return 301 /;
    }

    location /cgi-bin {
        methods GET POST;
        root www/cgi-bin;

        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}
server {
    listen 8081;
    root admin;

    location / {
        methods GET;
        index admin.html;
    }
}

