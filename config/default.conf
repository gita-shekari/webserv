server {
    listen 8080;
    root www;
    client_max_body_size 20m;

    error_page 400 errors/400.html;
    error_page 403 errors/403.html;
    error_page 404 errors/404.html;
    error_page 405 errors/405.html;
    error_page 413 errors/413.html;
    error_page 500 errors/500.html;

    location / {
        methods GET;
        index index.html;
    }

    location /upload {
        methods GET POST;
        root www/uploads;
        client_max_body_size 10m;
    }
}
server {
    listen 8081;
    root admin;

    location / {
        methods GET;
        index admin.html;
    }
}

server {
    listen 8082;
    root admin;

    location / {
        methods GET;
        index admin.html;
    }
}
